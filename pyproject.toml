[project]
name = "paper2code"
version = "0.1.0"
description = "Source-grounded paper implementation with Slick"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "slick-ai[openai]>=0.4.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
